<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daniil Reek - Reels Ideas Generator</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }
        
        header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }
        
        header p {
            font-size: 16px;
            opacity: 0.9;
        }
        
        .content {
            display: grid;
            grid-template-columns: 200px 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .buttons-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        button {
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        button:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateX(4px);
        }
        
        button.active {
            background: white;
            color: #667eea;
        }
        
        .idea-box {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            min-height: 300px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        .idea-box.loaded {
            justify-content: flex-start;
            align-items: stretch;
        }
        
        .loading {
            text-align: center;
            color: #999;
        }
        
        .loading i {
            font-size: 40px;
            color: #667eea;
            margin-bottom: 15px;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .idea-content {
            color: #333;
            line-height: 1.8;
            font-size: 15px;
            white-space: pre-wrap;
        }
        
        .idea-type {
            font-size: 12px;
            font-weight: 600;
            color: #667eea;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        
        .btn-secondary {
            flex: 1;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .btn-secondary:hover {
            background: #764ba2;
        }
        
        .error {
            color: #e74c3c;
            padding: 15px;
            background: #fadbd8;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        
        @media (max-width: 768px) {
            .content {
                grid-template-columns: 1fr;
            }
            
            header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎵 Reels Ideas Generator</h1>
            <p>Идеи для контента от Daniil Reek</p>
        </header>
        
        <div class="content">
            <div class="buttons-group">
                <button onclick="generateIdea('snippet')">
                    <i class="fas fa-music"></i> Music snippet
                </button>
                <button onclick="generateIdea('lifestyle')">
                    <i class="fas fa-camera"></i> Lifestyle
                </button>
                <button onclick="generateIdea('mood')">
                    <i class="fas fa-smile"></i> Mood video
                </button>
                <button onclick="generateIdea('branding')">
                    <i class="fas fa-star"></i> Artist branding
                </button>
            </div>
            
            <div class="idea-box" id="ideaBox">
                <div class="loading">
                    <p>Выбери тип контента 👈</p>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        let currentType = null;
        
        async function generateIdea(type) {
            currentType = type;
            const ideaBox = document.getElementById('ideaBox');
            
            ideaBox.className = 'idea-box';
            ideaBox.innerHTML = `
                <div class="loading">
                    <i class="fas fa-spinner"></i>
                    <p>Генерирую идею...</p>
                </div>
            `;
            
            try {
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ type })
                });
                
                if (!response.ok) throw new Error('Failed to generate');
                
                const data = await response.json();
                
                const typeNames = {
                    'snippet': 'Music snippet',
                    'lifestyle': 'Lifestyle',
                    'mood': 'Mood video',
                    'branding': 'Artist branding'
                };
                
                ideaBox.className = 'idea-box loaded';
                ideaBox.innerHTML = `
                    <div>
                        <div class="idea-type">${typeNames[type]}</div>
                        <div class="idea-content">${data.idea}</div>
                        <div class="button-group">
                            <button class="btn-secondary" onclick="generateIdea('${type}')">
                                <i class="fas fa-redo"></i> Еще идею
                            </button>
                        </div>
                    </div>
                `;
            } catch (error) {
                ideaBox.className = 'idea-box';
                ideaBox.innerHTML = `
                    <div style="width: 100%;">
                        <div class="error">
                            <i class="fas fa-exclamation-circle"></i> Ошибка при генерации. Проверь API ключ.
                        </div>
                        <button class="btn-secondary" onclick="generateIdea('${type}')">
                            <i class="fas fa-redo"></i> Попробовать снова
                        </button>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
